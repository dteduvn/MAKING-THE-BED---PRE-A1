<style>
/* Layout: one column of activity panels under a sticky level + activity bar; each panel = one big track player, then tap-to-hear lines */
:root{
  --bg:#FFF8E1; --card:#FFFFFF; --ink:#22302A; --muted:#5E6B63; --line:#FFD98A;
  --green:#2E9D45; --green-soft:#D9F5DC; --berry:#E0336B; --l1:#FFE27A; --l2:#BDE4FF; --l1ink:#5B4500; --l2ink:#123E66;

  --font:"Andika","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg) linear-gradient(180deg,#FFF1B8 0,#FFF8E1 260px) no-repeat;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto}
header.top{padding-block:22px 10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header.top img{width:84px;height:84px;object-fit:cover;border-radius:16px;border:3px solid var(--green)}
header.top h1{margin:0;font-size:clamp(26px,5vw,38px);color:var(--green);text-wrap:balance;line-height:1.1}
header.top p{margin:4px 0 0;color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.lv{display:inline-flex;border:2px solid var(--green);border-radius:999px;overflow:hidden;margin-bottom:10px}
.lv button{font:700 16px var(--font);border:0;background:transparent;color:var(--ink);padding:8px 18px;cursor:pointer}
.lv button[aria-pressed="true"].b1{background:var(--l1);color:var(--l1ink)}
.lv button[aria-pressed="true"].b2{background:var(--l2);color:var(--l2ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tabs button{flex:none;font:700 15px var(--font);border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
section.act{margin-top:18px}
.act h2{margin:0 0 4px;font-size:26px}
.act .how{color:var(--muted);margin:0 0 14px;max-width:65ch}
.player{background:var(--card);border:2px solid var(--green);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.player .pp{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--green);color:var(--bg);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.player .meta{flex:1;min-width:0}
.player .t{font-weight:700}
.player .sub{color:var(--muted);font-size:14px}
.prog{height:8px;background:var(--line);border-radius:4px;margin-top:8px;cursor:pointer;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:4px;width:0}
.time{flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:6px}
.vc{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.vc img{width:100%;height:110px;object-fit:contain;background:#fff;border-radius:10px}
.vc b{display:block;color:var(--berry);font-size:20px;margin-top:6px}
.vc.on,.ln.on{border-color:var(--berry);box-shadow:0 0 0 3px color-mix(in srgb,var(--berry) 25%,transparent)}
.lines{display:flex;flex-direction:column;gap:8px}
.ln{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}
.ln .ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:15px}
.ln .tx{flex:1;min-width:0;font-size:19px;font-weight:700;color:var(--berry)}
.ln .who{flex:none;font-size:13px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--green-soft);color:var(--green)}
.ln .who.B{background:var(--l2);color:var(--l2ink)}
.ln .trick{flex:none;font-size:13px;color:var(--muted)}
.steph{margin:14px 0 6px;display:flex;align-items:center;gap:12px}
.steph img{width:96px;height:66px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}
.steph b{font-size:20px;color:var(--green)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.comic{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.comic img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#fff;max-width:100%}
.note{font-size:14px;color:var(--muted);margin-top:14px}
.tip{background:var(--green-soft);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:15px}
.storyctl{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--green);border-radius:18px;padding:12px 16px;margin-bottom:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);z-index:4}
.storyctl .pp.big{width:64px;height:64px;font-size:26px;flex:none;border-radius:50%;border:0;background:var(--green);color:#fff;cursor:pointer}
.storyctl b{font-size:19px}.storyctl .sub{color:var(--muted);font-size:14px}
.scene{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;margin-bottom:18px;position:relative}
.scene img{display:block;width:100%;max-height:620px;object-fit:contain;background:#fff;border-radius:14px}
.snum{position:absolute;top:20px;left:20px;width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;z-index:1}
.stepb{position:absolute;top:20px;right:20px;background:var(--l1);color:var(--l1ink);font-weight:700;border-radius:10px;padding:4px 12px}
.scene .lines{margin-top:12px}
.scene .ln .tx{font-size:clamp(20px,3.6vw,28px)}
@media (max-width:520px){.storyctl{position:static}header.top{flex-wrap:nowrap;gap:10px}header.top img{width:56px;height:56px}header.top p{font-size:14px}.snum{top:16px;left:16px;width:34px;height:34px;font-size:17px}.comic{grid-template-columns:1fr 1fr 1fr}.vc img{height:90px}.player .pp{width:50px;height:50px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    s.appendChild(player(d.vocab.track, "Listen and repeat", `${d.vocab.lines.length} từ`));
    const g = document.createElement("div"); g.className="grid";
    d.vocab.lines.forEach(([t,c,img])=>{ const b=document.createElement("button"); b.className="vc"; b.innerHTML=`<img src="img/${img}.jpg" alt="${t}"><b>${t}</b>`; b.onclick=()=>playClip(c,b); g.appendChild(b); });
    s.appendChild(g);
  }
  if (cur === "story") {
    const dl = d.dialogue.lines, st = d.steps.lines;
    const scenes = [
      {img:"comic1", lines:[dl[0]]}, {img:"comic2", lines:[dl[1], dl[2]]}, {img:"comic3", lines:[dl[3], dl[4]]},
      ...[1,2,3,4].map(n => ({img:"step"+n, step:n, lines: st.filter(x=>x[2]===n).map(x=>[x[0], x[1], "M"])})),
      {img:"done", lines:[dl[5], dl[6]]}
    ];
    const ctl = document.createElement("div"); ctl.className = "storyctl";
    ctl.innerHTML = `<button class="pp big" id="all" aria-label="Đọc cả truyện">▶</button><div><b>Đọc cả truyện</b><div class="sub">${scenes.length} tranh · Mẹ và Con</div></div>`;
    s.appendChild(ctl);
    const btns = [];
    scenes.forEach((sc, i) => {
      const card = document.createElement("div"); card.className = "scene";
      card.innerHTML = `<div class="snum">${i+1}</div><img src="img/${sc.img}_lg.jpg" alt="Tranh ${i+1}">${sc.step?`<div class="stepb">Step ${sc.step}</div>`:""}`;
      const ls = document.createElement("div"); ls.className = "lines";
      sc.lines.forEach(([tx, cl, who]) => { const b = line(tx, cl, `<span class="who ${who}">${who==="M"?"Mummy":"Child"}</span>`); b.dataset.clip = cl; btns.push(b); ls.appendChild(b); });
      card.appendChild(ls); s.appendChild(card);
    });
    let playing = false;
    const allBtn = document.getElementById("all");
    allBtn.onclick = async () => {
      if (playing) { playing = false; stopAll(); allBtn.textContent = "▶"; return; }
      stopAll(); playing = true; allBtn.textContent = "❚❚";
      for (const b of btns) {
        if (!playing) break;
        document.querySelectorAll(".ln.on").forEach(e=>e.classList.remove("on")); b.classList.add("on");
        b.scrollIntoView({behavior:"smooth", block:"center"});
        await new Promise(res => { audio.src = "audio/" + b.dataset.clip + ".mp3"; audio.onended = () => setTimeout(res, 900); audio.onerror = res; audio.play().catch(res); });
      }
      if (playing) { playing = false; allBtn.textContent = "▶"; document.querySelectorAll(".ln.on").forEach(e=>e.classList.remove("on")); }
    };
  }
  if (cur === "dialogue") {
    s.appendChild(player(d.dialogue.track, "Cả đoạn hội thoại", "Giọng Mẹ và giọng Con"));
    const t=document.createElement("div"); t.className="two";
    t.appendChild(player(d.dialogue.track_m, "Con đóng vai Con", "Có lời Mẹ, phần của Con để trống"));
    t.appendChild(player(d.dialogue.track_b, "Con đóng vai Mẹ", "Có lời Con, phần của Mẹ để trống"));
    s.appendChild(t);
    const ls=document.createElement("div"); ls.className="lines"; ls.style.marginTop="12px";
    d.dialogue.lines.forEach(([tx,cl,who])=>ls.appendChild(line(tx,cl,`<span class="who ${who}">${who==="M"?"Mummy":"Child"}</span>`))); s.appendChild(ls);
  }
  if (cur === "seq") {
    const t=document.createElement("div"); t.className="two";
    t.appendChild(player(d.seq.track, "Đúng thứ tự", "Number 1 → Number 4"));
    t.appendChild(player(d.seq.track_game, "Yes or No?", "Hô Yes hoặc No trước khi nghe đáp án"));
    s.appendChild(t);
    const ls=document.createElement("div"); ls.className="lines"; ls.style.marginTop="12px";
    d.seq.lines.forEach(([tx,cl],i)=>ls.appendChild(line(tx,cl,`<span class="who">${i+1}</span>`))); s.appendChild(ls);
  }
  if (cur === "home") {
    s.appendChild(player(d.home.track, "Mỗi sáng dọn giường", "Chào buổi sáng → 4 bước → chant"));
    const tip=document.createElement("div"); tip.className="tip";
    tip.innerHTML = L===1 ? "Trong clip gửi cô, con nói: <b>Good morning, Mummy!</b> và <b>I can make my bed!</b>" : "Trong clip gửi cô, con kể đủ 4 bước bằng <b>First, Then, Next, Finally</b>.";
    s.appendChild(tip);
  }
  const n=document.createElement("p"); n.className="note"; n.textContent="Giọng đọc Anh-Anh. Level 1 đọc chậm hơn Level 2."; s.appendChild(n);
}
function tabs(){
  const t=document.getElementById("tabs"); t.innerHTML="";
  ACTS.forEach(a=>{ const b=document.createElement("button"); b.role="tab"; b.textContent=a.n; b.setAttribute("aria-selected", a.id===cur);
    b.onclick=()=>{ cur=a.id; history.replaceState(null,"","#"+a.id); tabs(); render(); }; t.appendChild(b); });
}
function setL(v){ L=v; try{localStorage.setItem("mtb_lv",String(v))}catch(e){}
  document.getElementById("lv1").setAttribute("aria-pressed", v===1); document.getElementById("lv2").setAttribute("aria-pressed", v===2); render(); }
document.getElementById("lv1").onclick=()=>setL(1); document.getElementById("lv2").onclick=()=>setL(2);
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(ACTS.some(a=>a.id===h)){cur=h;tabs();render();} });
setL(L); tabs();
</script>
