<title>Making the Bed Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: home = picture-led game menu with star counts; each game = one focused card centred on screen, big tap targets for 5–10-year-olds */
:root{
  --bg:#FFF8E1; --card:#FFFFFF; --ink:#21302A; --muted:#5D6B62; --line:#FFD98A;
  --green:#2E9D45; --green-soft:#D9F5DC; --berry:#E0336B; --sun:#FFD23F; --sunk:#5B4500;
  --sky:#BDE4FF; --skyk:#0E4C80; --ok:#3F9A45; --no:#D2553F;
  color-scheme:light;
  --font:"Andika","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg) linear-gradient(180deg,#FFF1B8 0,#FFF8E1 260px) no-repeat;color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:900px;margin:0 auto}
button{font-family:var(--font);color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:18px 8px}
header img{width:70px;height:70px;border-radius:14px;object-fit:cover;border:3px solid var(--green);background:#fff}
header h1{margin:0;font-size:clamp(24px,5vw,34px);color:var(--green);line-height:1.1}
header .sub{color:var(--muted);font-size:15px}
.stars{margin-left:auto;background:var(--card);border:2px solid var(--sun);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
.lv{display:inline-flex;border:2px solid var(--green);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.lv button{border:0;background:transparent;font-weight:700;font-size:16px;padding:8px 16px}
.lv button[aria-pressed="true"].b1{background:var(--sun);color:var(--sunk)}
.lv button[aria-pressed="true"].b2{background:var(--sky);color:var(--skyk)}
.group{margin:14px 0 6px;font-weight:700;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gm{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left;min-height:84px}
.gm:hover{border-color:var(--green)}
.gm .e{flex:none;width:52px;height:52px;border-radius:14px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:28px}
.gm b{display:block;font-size:18px}
.gm span{display:block;color:var(--muted);font-size:14px}
.gm .done{color:var(--ok);font-weight:700}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
.back{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700}
.gtitle{font-size:22px;font-weight:700}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--green)}
.ins{margin:0 0 12px;color:var(--muted)}
.stage{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;text-align:center}
.hear{border:0;background:var(--green);color:var(--bg);border-radius:14px;padding:12px 20px;font-size:18px;font-weight:700}
.big img{width:min(100%,360px);height:240px;object-fit:contain;background:#fff;border-radius:16px}
.word{font-size:clamp(34px,7vw,52px);font-weight:700;color:var(--berry);margin:8px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.nav{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 18px;font-size:18px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media (min-width:640px){.opts.four{grid-template-columns:repeat(4,1fr)}}
.opt{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px;font-size:20px;font-weight:700;min-height:64px}
.opt img{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:10px;display:block}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.no{border-color:var(--no);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0;min-height:58px}
.slot{width:46px;height:56px;border-bottom:4px solid var(--ink);font-size:32px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;color:var(--berry)}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{width:52px;height:56px;border-radius:12px;border:2px solid var(--green);background:var(--green-soft);font-size:28px;font-weight:700}
.tile[disabled]{opacity:.25;cursor:default}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chip{border:2px solid var(--green);background:var(--card);border-radius:12px;padding:10px 14px;font-size:20px;font-weight:700}
.chip[disabled]{opacity:.25;cursor:default}
.built{min-height:66px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:22px;font-weight:700;color:var(--berry)}
.sent{font-size:clamp(24px,5vw,32px);font-weight:700;margin:10px 0}
.gap{display:inline-block;min-width:110px;border-bottom:4px solid var(--ink);color:var(--ok)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{border:3px solid var(--line);background:var(--card);border-radius:14px;min-height:94px;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:6px}
.mi img{height:84px;width:100%;object-fit:contain;background:#fff;border-radius:8px}
.mi.sel{border-color:var(--skyk);background:var(--sky)}
.mi.ok{border-color:var(--ok);opacity:.45}
.seqg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sq{position:relative;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:8px}
.sq img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:10px;display:block}
.sq .n{position:absolute;top:8px;left:8px;width:40px;height:40px;border-radius:50%;background:var(--green);color:var(--bg);font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center}
.sq.ok{border-color:var(--ok)}
.say{background:var(--green-soft);border-radius:16px;padding:12px 16px;display:inline-flex;gap:10px;align-items:center;font-size:22px;font-weight:700;margin:6px 0}
.who{font-size:14px;border-radius:8px;padding:2px 8px;background:var(--card);color:var(--green)}
.fb{min-height:30px;font-weight:700;margin-top:10px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.win{padding:20px}
.win .big{font-size:64px}
.note{color:var(--muted);font-size:14px;margin-top:16px}
.player{background:var(--card);border:2px solid var(--green);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;text-align:left}
.player .pp{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--green);color:var(--bg);font-size:24px;display:flex;align-items:center;justify-content:center}
.player .meta{flex:1;min-width:0}.player .t{font-weight:700}.player .sub{color:var(--muted);font-size:14px}
.prog{height:8px;background:var(--line);border-radius:4px;margin-top:8px;cursor:pointer;position:relative}.prog i{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:4px;width:0}
.time{flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.comic{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.comic img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#fff;max-width:100%}
.lines{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ln{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;color:inherit;text-align:left;width:100%}
.ln .ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:15px}
.ln .tx{flex:1;min-width:0;font-size:19px;font-weight:700;color:var(--berry)}
.ln .wh{flex:none;font-size:13px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--green-soft);color:var(--green)}
.ln .wh.B{background:var(--sky);color:var(--skyk)}
.ln.on{border-color:var(--berry)}
.tip{background:var(--green-soft);border-radius:14px;padding:12px 14px;margin-top:4px;text-align:left}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.steps4 img{width:100%;height:90px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}
@media (max-width:520px){.steps4{grid-template-columns:repeat(2,1fr)}}
.scn{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px;margin-bottom:16px}
.scn img{display:block;width:100%;height:auto;max-height:560px;object-fit:contain;background:#fff;border-radius:12px}
.scn .lines{margin-top:10px}.scn .ln .tx{font-size:clamp(19px,3.4vw,26px)}
.snum{position:absolute;top:18px;left:18px;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;z-index:1}
.stepb{position:absolute;top:18px;right:18px;background:var(--sun);color:var(--sunk);font-weight:700;border-radius:10px;padding:3px 12px;z-index:1}
.stepb2{display:inline-block;background:var(--sun);color:var(--sunk);font-weight:700;border-radius:10px;padding:3px 12px;margin-top:8px}
.say .who.M,.opt .who.M{background:var(--green-soft);color:var(--green)}
.say .who.B,.opt .who.B{background:var(--sky);color:var(--skyk)}
.opt .who{font-size:13px;border-radius:8px;padding:2px 8px;vertical-align:middle}
.say.dim{opacity:.55;font-size:18px}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  function q(){
    dots(n); const k = qs[n], opts = shuffle([0,1,2,3]);
    st.innerHTML = `<button class="hear" id="hr">🔊 Hear again</button><div class="opts four">${opts.map(o=>`<button class="opt" data-k="${o}"><img src="step${o+1}.jpg" alt="Một bước dọn giường"></button>`).join("")}</div><div class="fb" id="fb"></div>`;
    $("hr").onclick = () => play(steps[k].c); play(steps[k].c);
    let locked = false;
    st.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (locked) return;
      if (+b.dataset.k === k) { locked = true; b.classList.add("ok"); star(); $("fb").className="fb ok"; $("fb").textContent = steps[k].t;
        playThen("fx_welldone", () => { n++; n < N ? q() : (dots(N), finish("listen")); }); }
      else wrong(b, $("fb"));
    });
  }
  q();
}

let active = null;
function fmt(x){ if(!isFinite(x)) return "0:00"; x=Math.round(x); return Math.floor(x/60)+":"+String(x%60).padStart(2,"0"); }
function resetPlayers(){ document.querySelectorAll(".pp").forEach(b=>b.textContent="▶"); document.querySelectorAll(".ln.on").forEach(e=>e.classList.remove("on")); }
function player(file, title, sub){
  const w = document.createElement("div"); w.className = "player";
  w.innerHTML = `<button class="pp" aria-label="Phát">▶</button><div class="meta"><div class="t">${title}</div><div class="sub">${sub}</div><div class="prog"><i></i></div></div><div class="time">0:00</div>`;
  const pp = w.querySelector(".pp"), bar = w.querySelector(".prog"), fill = bar.querySelector("i"), tm = w.querySelector(".time");
  const probe = new Audio("" + file); probe.preload = "metadata"; probe.onloadedmetadata = () => { if (active !== w) tm.textContent = fmt(probe.duration); };
  pp.onclick = () => {
    if (active === w && !au.paused) { au.pause(); pp.textContent = "▶"; return; }
    if (active !== w) { au.pause(); resetPlayers(); active = w; au.src = "" + file; }
    au.onended = () => { pp.textContent = "▶"; fill.style.width = "0"; if (file.includes("Home")) { done[L+"home"]=1; save(); } };
    au.ontimeupdate = () => { if (active === w) { fill.style.width = (au.currentTime/au.duration*100||0)+"%"; tm.textContent = fmt(au.currentTime)+" / "+fmt(au.duration); } };
    au.play().catch(()=>{}); pp.textContent = "❚❚";
  };
  bar.onclick = e => { if (active === w && au.duration) { const r = bar.getBoundingClientRect(); au.currentTime = (e.clientX - r.left) / r.width * au.duration; } };
  return w;
}
function gDialogue(){
  active = null; const st = frame("dialogue"), d = D[L].dialogue; st.style.textAlign = "left";
  st.innerHTML = `<div class="row" style="justify-content:flex-start;margin:0 0 14px"><button class="hear" id="all">▶ Đọc cả truyện</button></div>`;
  const btns = [];
  storyScenes().forEach((sc, i) => {
    const card = document.createElement("div"); card.className = "scn";
    card.innerHTML = `<span class="snum">${i+1}</span>${sc.step?`<span class="stepb">Step ${sc.step}</span>`:""}<img src="${sc.img}_lg.jpg" alt="Tranh ${i+1}">`;
    const ls = document.createElement("div"); ls.className = "lines";
    sc.lines.forEach(([tx, cl, who]) => { const b = document.createElement("button"); b.className = "ln"; b.dataset.c = cl;
      b.innerHTML = `<span class="ic" aria-hidden="true">🔊</span><span class="tx">${tx}</span><span class="wh ${who}">${WHO(who)}</span>`;
      b.onclick = () => { reading = false; active = null; resetPlayers(); b.classList.add("on"); playThen(cl, () => b.classList.remove("on")); }; btns.push(b); ls.appendChild(b); });
    card.appendChild(ls); st.appendChild(card);
  });
  let reading = false;
  $("all").onclick = async () => {
    if (reading) { reading = false; au.pause(); $("all").textContent = "▶ Đọc cả truyện"; return; }
    reading = true; $("all").textContent = "❚❚ Dừng";
    for (const b of btns) { if (!reading) break; resetPlayers(); b.classList.add("on"); b.scrollIntoView({behavior:"smooth", block:"center"});
      await new Promise(r => playThen(b.dataset.c, () => setTimeout(r, 800))); }
    reading = false; resetPlayers(); if ($("all")) $("all").textContent = "▶ Đọc cả truyện";
  };
  const h = document.createElement("p"); h.className = "ins"; h.style.marginTop = "18px"; h.innerHTML = "<b>Phân vai</b> · Đọc xong truyện rồi luyện nói vai còn lại vào khoảng trống."; st.appendChild(h);
  st.appendChild(player(d.track, "Cả đoạn hội thoại", "Giọng Mẹ và giọng Con"));
  const t = document.createElement("div"); t.className = "two";
  t.appendChild(player(d.track_m, "Con đóng vai Con", "Có lời Mẹ, phần của Con để trống"));
  t.appendChild(player(d.track_b, "Con đóng vai Mẹ", "Có lời Con, phần của Mẹ để trống"));
  st.appendChild(t);
  const fin = document.createElement("div"); fin.className = "row"; fin.innerHTML = `<button class="hear" id="dn">✓ Con đã luyện xong</button>`; st.appendChild(fin);
  $("dn").onclick = () => { reading = false; au.pause(); star(); finish("dialogue"); };
}
function gHome(){
  active = null; const st = frame("home"), d = D[L]; st.style.textAlign = "left";
  st.innerHTML = `<div class="steps4">${[1,2,3,4].map(i=>`<img src="step${i}.jpg" alt="Bước ${i}">`).join("")}</div>`;
  st.appendChild(player(d.home.track, "Mỗi sáng dọn giường", "Chào buổi sáng → 4 bước → chant"));
  const tip = document.createElement("div"); tip.className = "tip";
  tip.innerHTML = L===1 ? "Trong clip gửi cô, con nói: <b>Good morning, Mummy!</b> và <b>I can make my bed!</b>" : "Trong clip gửi cô, con kể đủ 4 bước bằng <b>First, Then, Next, Finally</b>.";
  st.appendChild(tip);
  const fin = document.createElement("div"); fin.className = "row"; fin.innerHTML = `<button class="hear" id="dn">✓ Con đã dọn giường xong</button>`; st.appendChild(fin);
  $("dn").onclick = () => { au.pause(); star(); finish("home"); };
}
home();
</script>
